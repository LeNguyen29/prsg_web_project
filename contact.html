<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRSG - Contact</title>
    <link rel="icon" type="image/x-icon" href="/assets/Logo/FS_Icon.webp">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/navbar_style.css">
    <link rel="stylesheet" href="/css/footer_style.css">
    <link rel="stylesheet" href="/css/contact_style.css">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div id="navbar_div"></div>
    </header>

    <main>
        <div class="contact_card">
            <div class="contact_info">
                <h1>CONTACT US</h1>
                <p>
                    We are open for communication. 
                    For general inquiries, business, partnership, etc. please email us at:
                </p>
                <p id="contact_email">FRAGMENTEDSTUDIOS@gmail.com</p>
                <p>
                    For help with any game related issues or questions, please visit 
                    <span><a href="https://discord.gg/4AddNtrVyC" target="_blank">our discord</a></span> 
                    or 
                    <span><a href="https://www.roblox.com/communities/11406232/Fragmented-Studios" target="_blank">our group</a></span> on Roblox.
                </p>
            </div>

            <img class="studio_logo" src="/assets/Logo/Studio_Circle.png">
        </div>
    </main>

    <footer>
        <div id="footer_content"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/94c96a59cb.js" crossorigin="anonymous"></script>
</body>
</html>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar_div").innerHTML = data;
        });

    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer_content").innerHTML = data;
        });
</script>
