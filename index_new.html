<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1">
        <title>PRSG - Homepage</title>

        <link rel="icon" type="image/x-icon" href="assets/Logo/FS_Icon.webp">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="css/navbar_style.css">
        <link rel="stylesheet" href="css/footer_style.css">
        <link rel="stylesheet" href="css/index_style_new.css">
    </head>
    <body>
        <header>
            <div id="navbar_div"></div>
        </header>

        <main>
            <section id="home_section">
                <div class="container-fluid mt-5 pt-2 d-flex flex-column justify-content-center align-items-center">
                    <div class="video_wrapper">
                        <iframe
                            src="https://player.vimeo.com/video/1210853125?autoplay=1&background=1&loop=1&autopause=0"
                            frameborder="0" frameborder="0" webkitallowfullscreen="" 
                            mozallowfullscreen="" allowfullscreen="allowfullscreen">
                        </iframe>
                    </div>

                    <div class="bg_image"></div>

                    <div class="section_content row">
                        <div class="col d-flex justify-content-center align-items-center mb-3">
                            <img class="game_logo img-fluid" src="assets/Logo/PRSG_Logo.png">
                        </div>
                        
                        <div class="col-lg-6 col d-flex justify-content-center align-items-center mb-3">
                            <p class="game_desc">
                                Fan made open world Power Rangers RPG game on Roblox that lets you fight evil and do dramatic
                                poses
                            </p>
                        </div>
                        
                        <div class="col-lg-3 col d-flex justify-content-center align-items-center">
                            <button type="button" class="play_btn btn btn-primary text-wrap">
                                Join The Pre Alpha <i class="fa-solid fa-play"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <div id="footer_content"></div>
        </footer>
    </body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/94c96a59cb.js" crossorigin="anonymous"></script>
</html>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar_div").innerHTML = data;
        });

    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer_content").innerHTML = data;
        });
</script>
