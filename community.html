<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRSG - Community</title>
    <link rel="icon" type="image/x-icon" href="assets/Logo/FS_Icon.webp">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/navbar_style.css">
    <link rel="stylesheet" href="css/footer_style.css">
    <link rel="stylesheet" href="css/community_style.css">
</head>
<body>
    <header>
        <div id="navbar_div"></div>
    </header>

    <main>
        <section id="page_title">
            <div class="page_title p-5 container-fluid d-flex
                            justify-content-center align-items-center">
                <div class="row d-flex flex-column p-5
                            justify-content-center align-items-center">
                    
                    <div class="col pb-3">
                        <h1>
                            COMMUNITY
                        </h1>
                    </div>
                    
                    <div class="col pb-3">
                        <p>
                            Connect with an ever growing community united by the love of the Tokusatsu genre.
                        </p>
                    </div>

                    <div class="col">
                        <a type="button" class="join_btn btn btn-primary text-wrap" target="_blank" 
                                href="https://discord.gg/AUPSHXndrN">
                            Join Our Discord
                        </a>
                    </div>
                </div>

                <img src="assets/Image/All_Rangers.webp" class="card_bg_image">
            </div>
        </section>

        <section id="gallery_section">
            <div class="gallery_container container-fluid d-flex align-items-center justify-content-center">
                <div class="row p-4 d-flex flex-column align-items-center justify-content-center">
                    <div class="col text-center">
                        <h2>Community Gallery</h2>
                        <p>
                            Click on the image to view their full size
                        </p>
                    </div>

                    <div class="col">
                        <nav class="gallery_pagination">
                            <ul id="pagination_top" class="pagination"></ul>
                        </nav>
    
                        <div id="gallery_grid" class="gallery_grid p-4"></div>
    
                        <nav class="gallery_pagination">
                            <ul id="pagination_bottom" class="pagination"></ul>
                        </nav>
                    </div>
                </div>
            </div>
        </section>

        <div class="modal fade" id="imageModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered modal-xl">
                <div class="modal-content bg-dark">
                <div class="modal-body">
                    <img id="modalImage" src="" alt="Full size preview" class="modal_img">
                </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="footer_content"></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/94c96a59cb.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/community.js"></script>
</body>
</html>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar_div").innerHTML = data;
        });

    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer_content").innerHTML = data;
        });
</script>
