<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PRSG - News</title>
        <link rel="icon" type="image/x-icon" href="assets/Logo/FS_Icon.webp">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="css/navbar_style.css">
        <link rel="stylesheet" href="css/footer_style.css">
        <linK rel="stylesheet" href="css/news_style_tmp.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    </head>

    <body>
        <header>
            <div id="navbar_div"></div>
        </header>

        <main>
            <section id="page_title">
                <div class="title_container container-fluid mt-5
                                d-flex align-items-center justify-content-center">
                    <div class="row d-flex flex-column align-items-center justify-content-center">
                        <h1 class="text-center">NEWS</h1>
                        <p class="text-center">
                            Read the latest Fragment Studios development and game updates
                        </p>
                    </div>

                    <img src="assets/Image/KibaWallpaper.webp" class="card_bg_image" alt="White ranger staring at a dragon">
                </div>
            </section>

            <section class="news_section">
                <div class="container-fluid">
                    <div class="row d-flex flex-column 
                                align-items-center justify-content-center
                                p-5">
                        <div class="d-flex align-items-center justify-content-center">
                            <nav class="pagination_container">
                                <ul id="pagination_top" class="pagination"></ul>
                            </nav>
                        </div>

                        <div id="news_list" class="news_list"></div>

                        <div class="d-flex align-items-center justify-content-center">
                            <nav class="pagination_container">
                                <ul id="pagination_bottom" class="pagination"></ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <div id="footer_content"></div>
        </footer>
    </body>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://kit.fontawesome.com/94c96a59cb.js" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="js/news_tmp.js"></script>
</html>

<script>
    fetch("navbar.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("navbar_div").innerHTML = data;
        });

    fetch("footer.html")
        .then(response => response.text())
        .then(data => {
            document.getElementById("footer_content").innerHTML = data;
        });
</script>
